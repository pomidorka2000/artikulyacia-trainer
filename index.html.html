<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Артикуляционный тренажёр — автономная версия</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#14120F;--paper:#F2EDE4;--card:#FBF8F2;--line:rgba(20,18,15,.14);
      --dim:#6E665C;--go:#2E4A38;--warn:#8A4B2A}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Lora',Georgia,serif;
     -webkit-font-smoothing:antialiased;padding-bottom:5rem}
.wrap{max-width:720px;margin:0 auto;padding:0 1rem}
.mono{font-family:'IBM Plex Mono',monospace}
button{font-family:'IBM Plex Mono',monospace;font-size:.74rem;letter-spacing:.09em;
  text-transform:uppercase;padding:.7rem 1rem;border:1.5px solid var(--ink);
  background:transparent;color:var(--ink);cursor:pointer;border-radius:2px;
  transition:background .15s,color .15s}
button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
button.p{background:var(--ink);color:var(--paper)}
button.p:hover{background:var(--go);border-color:var(--go)}
button:disabled{opacity:.28;cursor:default}

header{border-bottom:2px solid var(--ink);padding:1.4rem 0 .9rem;margin-bottom:1rem}
.eye{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.22em;
     text-transform:uppercase;color:var(--dim)}
h1{font-size:1.55rem;font-weight:700;letter-spacing:-.02em;margin:.3rem 0 .6rem}
.stats{display:flex;gap:1.3rem;align-items:baseline;flex-wrap:wrap;
  font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.05em;color:var(--dim)}
.stats b{font-family:'Lora';font-size:1.25rem;font-weight:700;color:var(--ink);margin-right:.28rem}

.rail{display:flex;gap:2px;margin:.9rem 0 1.1rem}
.rail i{flex:1;height:5px;background:#E0D8CA;border-radius:1px;cursor:pointer}
.rail i.done{background:var(--go)}
.rail i.now{background:var(--warn)}

.card{background:var(--card);border:1.5px solid var(--ink);border-radius:3px;
      padding:1.3rem 1.2rem 1.4rem;position:relative}
.badge{position:absolute;top:-.8rem;left:1.1rem;background:var(--ink);color:var(--paper);
  font-family:'IBM Plex Mono',monospace;font-size:.66rem;padding:.24rem .6rem;letter-spacing:.08em}
.blk{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.2em;
     text-transform:uppercase;color:var(--dim);margin-bottom:.4rem}
h2{font-size:1.5rem;font-weight:700;line-height:1.1;letter-spacing:-.015em;margin-bottom:1rem}

.fig{border:1px solid var(--line);border-radius:2px;background:#fff;padding:.7rem;
     margin-bottom:1rem;text-align:center}
.fig svg{width:100%;max-width:340px;height:auto}
.figcap{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin-top:.4rem}

ol.steps{list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding-left:2.1rem;
  font-size:.98rem;line-height:1.45;margin-bottom:.7rem;transition:opacity .2s}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:.05rem;
  width:1.4rem;height:1.4rem;border:1.5px solid var(--ink);border-radius:50%;
  font-family:'IBM Plex Mono',monospace;font-size:.7rem;text-align:center;line-height:1.25rem}
ol.steps li.on:before{background:var(--ink);color:var(--paper)}
ol.steps li.off{opacity:.42}

.timer{display:flex;align-items:center;gap:1rem;margin-top:1.1rem;
  border-top:1px solid var(--line);padding-top:1.1rem;flex-wrap:wrap}
.ring{position:relative;width:76px;height:76px;flex:0 0 76px}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:1.02rem;font-variant-numeric:tabular-nums}
.tbtns{display:flex;gap:.5rem;flex-wrap:wrap}
.dose{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);width:100%}

.ctrl{margin-top:1.1rem;border-top:1px solid var(--line);padding-top:1rem}
.ctrl .h{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim);margin-bottom:.55rem}
.ctrl div{font-size:.93rem;line-height:1.4;padding-left:1rem;position:relative;margin-bottom:.3rem}
.ctrl div:before{content:"—";position:absolute;left:0;color:var(--dim)}

.bar{display:flex;gap:.5rem;margin-top:1.2rem;flex-wrap:wrap}
.opts{display:flex;gap:1rem;margin-top:.9rem;flex-wrap:wrap;
  font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--dim)}
.opts label{display:flex;align-items:center;gap:.4rem;cursor:pointer}
.opts input{width:15px;height:15px;accent-color:var(--go);cursor:pointer}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px;margin-top:.6rem}
.grid button{padding:.5rem 0;font-size:.72rem;letter-spacing:0}
.grid button.dn{background:var(--go);color:var(--paper);border-color:var(--go)}
.grid button.cur{background:var(--warn);color:var(--paper);border-color:var(--warn)}
.sec{margin-top:1.6rem;border-top:1px solid var(--line);padding-top:1rem}
.sec h3{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim);margin-bottom:.3rem}

.done{text-align:center;padding:2.4rem 1rem}
.done .big{font-size:2.9rem;font-weight:700;letter-spacing:-.03em}
.done p{margin-top:.7rem;color:var(--dim);line-height:1.5}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:.5rem}
.dots i{width:14px;height:14px;background:#E0D8CA;border-radius:2px}
.dots i.on{background:var(--go)}
.dots i.today{outline:1.5px solid var(--ink);outline-offset:1px}
.err{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--warn);margin-top:.8rem}
#io{display:none;width:100%;min-height:74px;margin-top:.6rem;padding:.6rem;
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;line-height:1.4;
  border:1.5px solid var(--ink);border-radius:2px;background:var(--card);
  color:var(--ink);resize:vertical;word-break:break-all}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:520px){h1{font-size:1.35rem}h2{font-size:1.25rem}}
</style></head><body>
<div class="wrap">
<header>
  <div class="eye">Артикуляционная гимнастика · 16 упражнений</div>
  <h1>Тренажёр</h1>
  <div class="stats">
    <span><b id="sStreak">0</b>дней подряд</span>
    <span><b id="sTotal">0</b>всего</span>
    <span><b id="sLeft">16</b>осталось сегодня</span>
  </div>
</header>
<div class="rail" id="rail"></div>
<div id="app"></div>
<div class="err" id="err"></div>
<div class="sec">
  <h3>Перенос прогресса</h3>
  <div class="bar">
    <button onclick="exportProgress()">Скопировать код</button>
    <button onclick="importProgress()">Загрузить</button>
  </div>
  <textarea id="io" spellcheck="false"
    placeholder="Код прогресса вставьте сюда"></textarea>
</div>
</div>

const KEY='artik:v2';
let S={i:0,t:EX[0].sec,run:false,done:new Set(),fin:false,auto:false,sound:true,step:0};
let store={streak:0,total:0,last:null,hist:[]};
let tick=null, stepTick=null;

/* ---------- звук ---------- */
let AC=null;
function beep(f,d){ if(!S.sound) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination); o.frequency.value=f; o.type='sine';
    g.gain.setValueAtTime(.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.22,AC.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.start(); o.stop(AC.currentTime+d+.02);
  }catch(e){}
}

/* ---------- хранилище ---------- */
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function diff(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
/* Хранилище: пробуем localStorage, затем sessionStorage, иначе память.
   В приватном режиме некоторых браузеров запись запрещена — тогда работаем
   в пределах вкладки и честно предупреждаем об этом. */
const DB = (function(){
  for (const box of [
        ()=>window.localStorage, ()=>window.sessionStorage ]) {
    try{ const s=box(); const p='__t'; s.setItem(p,'1'); s.removeItem(p);
         return {kind: s===window.localStorage?'local':'session',
                 get:k=>s.getItem(k), set:(k,v)=>s.setItem(k,v)}; }
    catch(e){}
  }
  const m={};
  return {kind:'memory', get:k=>(k in m? m[k]:null), set:(k,v)=>{m[k]=v}};
})();

function note(){
  const el=document.getElementById('err');
  if(DB.kind==='memory') el.textContent='Браузер запретил запись — прогресс не сохранится после закрытия вкладки.';
  else if(DB.kind==='session') el.textContent='Прогресс сохранится только до закрытия вкладки.';
}
async function load(){
  try{ const v=DB.get(KEY); if(v) store=JSON.parse(v); }catch(e){}
  note(); paint();
}
async function save(){
  try{ DB.set(KEY,JSON.stringify(store)); note(); }
  catch(e){ document.getElementById('err').textContent='Прогресс не сохранился.'; }
}

/* ── перенос прогресса между устройствами ── */
function exportProgress(){
  const box=document.getElementById('io');
  box.value=JSON.stringify(store);
  box.style.display='block'; box.select();
}
function importProgress(){
  const box=document.getElementById('io');
  if(box.style.display!=='block'){ box.value=''; box.style.display='block'; box.focus();
    document.getElementById('err').textContent='Вставьте код и нажмите «Загрузить» ещё раз.'; return; }
  try{
    const o=JSON.parse(box.value);
    if(typeof o.total!=='number'||!Array.isArray(o.hist)) throw 0;
    store=o; save(); paint(); render();
    document.getElementById('err').textContent='Прогресс загружен.';
    box.style.display='none';
  }catch(e){ document.getElementById('err').textContent='Не похоже на код прогресса — проверьте, что скопировали целиком.'; }
}
function paint(){
  let s=store.streak;
  if(store.last && diff(store.last,today())>1) s=0;
  document.getElementById('sStreak').textContent=s;
  document.getElementById('sTotal').textContent=store.total;
  document.getElementById('sLeft').textContent=EX.length-S.done.size;
}

/* ---------- таймер ---------- */
function start(){
  if(S.run) return;
  S.run=true; beep(660,.09);
  tick=setInterval(()=>{
    S.t--;
    if(S.t===3||S.t===2||S.t===1) beep(520,.06);
    if(S.t<=0){ S.t=0; clearInterval(tick); clearInterval(stepTick); S.run=false;
      beep(880,.35);
      S.done.add(S.i); paint();
      if(S.auto){ setTimeout(()=>{ if(!S.run) next(); },1100); }
    }
    render();
  },1000);
  // подсветка шагов по ходу таймера
  const per=Math.max(2,Math.round(EX[S.i].sec/3));
  stepTick=setInterval(()=>{ if(!S.run) return;
    const el=EX[S.i].sec-S.t; S.step=Math.min(2,Math.floor(el/per)); render(); },500);
  render();
}
function pause(){ clearInterval(tick); clearInterval(stepTick); S.run=false; render(); }
function reset(){ pause(); S.t=EX[S.i].sec; S.step=0; render(); }
function go(i){ pause(); S.i=i; S.t=EX[i].sec; S.step=0; S.fin=false; render(); scrollTop(); }
function next(){ if(S.i<EX.length-1) go(S.i+1); else finish(); }
function prev(){ if(S.i>0) go(S.i-1); }
function skip(){ S.done.add(S.i); paint(); next(); }
function scrollTop(){ window.scrollTo({top:0,behavior:'smooth'}); }

async function finish(){
  pause();
  const t=today();
  if(store.last!==t){
    const d=store.last?diff(store.last,t):null;
    store.streak=(d===1)?store.streak+1:1;
    store.total++; store.last=t;
    store.hist.push(t); if(store.hist.length>120) store.hist=store.hist.slice(-120);
    await save();
  }
  S.fin=true; paint(); beep(990,.5); render(); scrollTop();
}
function restart(){ S={i:0,t:EX[0].sec,run:false,done:new Set(),fin:false,auto:S.auto,sound:S.sound,step:0}; paint(); render(); scrollTop(); }

/* ---------- отрисовка ---------- */
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function rail(){
  const r=document.getElementById('rail'); r.innerHTML='';
  EX.forEach((_,i)=>{ const e=document.createElement('i');
    e.title='Упражнение '+(i+1);
    e.className = S.done.has(i)?'done':(i===S.i&&!S.fin?'now':'');
    e.onclick=()=>go(i); r.appendChild(e); });
}
function ring(){
  const e=EX[S.i], frac=e.sec? S.t/e.sec : 0, C=2*Math.PI*33;
  return `<div class="ring"><svg width="76" height="76">
    <circle cx="38" cy="38" r="33" fill="none" stroke="#E0D8CA" stroke-width="5"/>
    <circle cx="38" cy="38" r="33" fill="none" stroke="${S.run?'#2E4A38':'#14120F'}"
      stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}"
      stroke-dashoffset="${C*(1-frac)}"/></svg>
    <div class="t">${fmt(S.t)}</div></div>`;
}
function render(){
  rail();
  const app=document.getElementById('app');
  if(S.fin){
    const set=new Set(store.hist); let dots='';
    for(let i=27;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i);
      const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      dots+=`<i class="${set.has(k)?'on':''}${i===0?' today':''}"></i>`; }
    app.innerHTML=`<div class="card"><div class="done">
      <div class="big">Готово</div>
      <p>Комплекс пройден. Завтра утром перед зеркалом — снова.</p>
      <div class="bar" style="justify-content:center"><button class="p" onclick="restart()">Пройти ещё раз</button></div>
      </div>
      <div class="sec"><h3>Последние 28 дней</h3><div class="dots">${dots}</div></div>
    </div>`;
    return;
  }
  const e=EX[S.i];
  const steps=e.steps.map((s,i)=>`<li class="${S.run?(i===S.step?'on':(i<S.step?'':'off')):''}">${s}</li>`).join('');
  const ctrl=e.ctrl.map(c=>`<div>${c}</div>`).join('');
  const grid=EX.map((x,i)=>`<button class="${S.done.has(i)?'dn':''}${i===S.i?' cur':''}" onclick="go(${i})">${x.n}</button>`).join('');
  app.innerHTML=`
  <div class="card">
    <div class="badge">${String(e.n).padStart(2,'0')} / ${EX.length}</div>
    <div class="blk">${e.blk}</div>
    <h2>${e.t}</h2>
    <div class="fig">${e.svg}<div class="figcap">${e.cap}</div></div>
    <ol class="steps">${steps}</ol>
    <div class="timer">
      ${ring()}
      <div class="tbtns">
        <button class="p" onclick="${S.run?'pause()':'start()'}">${S.run?'Пауза':'Пуск'}</button>
        <button onclick="reset()">Сброс</button>
      </div>
      <div class="dose">${e.dose}</div>
    </div>
    <div class="ctrl"><div class="h">Контроль в зеркале</div>${ctrl}</div>
    <div class="bar">
      <button onclick="prev()" ${S.i===0?'disabled':''}>Назад</button>
      <button onclick="skip()">Пропустить</button>
      <button class="p" onclick="${S.i===EX.length-1?'finish()':'skip()'}">${S.i===EX.length-1?'Завершить':'Дальше'}</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" ${S.auto?'checked':''} onchange="S.auto=this.checked">автопереход</label>
      <label><input type="checkbox" ${S.sound?'checked':''} onchange="S.sound=this.checked">звук</label>
    </div>
  </div>
  <div class="sec"><h3>Все упражнения</h3><div class="grid">${grid}</div></div>`;
}

document.addEventListener('keydown',ev=>{
  if(ev.target.tagName==='INPUT') return;
  if(ev.code==='Space'){ ev.preventDefault(); S.run?pause():start(); }
  if(ev.code==='ArrowRight') next();
  if(ev.code==='ArrowLeft') prev();
});

render(); load();
</script></body></html>
